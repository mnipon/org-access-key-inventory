AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Read-only IAM role that lets the org-wide access-key inventory Lambda (running
  in the management account) enumerate IAM access keys and long-term Amazon
  Bedrock API key metadata (IAM service-specific credentials) in this account.
  Only the inventory Lambda's role (InventoryRoleName in TrustedAccountId, from
  your org) can assume it. Deploy either via a service-managed StackSet
  (auto-applied org-wide) or standalone in a single account. No account IDs are
  hardcoded -- all values are parameters.

Parameters:
  RoleName:
    Type: String
    Default: OrgAccessKeyAuditRole
    Description: Must match a name in the Lambda's CANDIDATE_ROLES list.
  TrustedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: >
      Account ID that hosts the inventory Lambda (your management or audit
      account). Supplied at deploy time -- never hardcoded in this template.
  InventoryRoleName:
    Type: String
    Default: org-access-key-inventory-inventory-role
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
    Description: >
      Name of the inventory Lambda's role in TrustedAccountId (<stack>-inventory-role;
      deploy-audit-role-stackset.sh derives it from the main stack name). Only
      that role can assume this one.
  OrgId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
    Description: >
      Your AWS Organizations ID (o-xxxx). Used as an aws:PrincipalOrgID
      condition, together with the aws:PrincipalArn condition on
      InventoryRoleName, so only the inventory role from your org can assume
      this role.

Resources:
  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only access for org-wide IAM access-key and Bedrock API key inventory.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrgId
              ArnEquals:
                # Only the inventory role, not every principal in the trusted account.
                # A condition (not a role principal), so the StackSet can be deployed
                # before the role exists and keeps working if the role is re-created.
                aws:PrincipalArn: !Sub "arn:aws:iam::${TrustedAccountId}:role/${InventoryRoleName}"
      Policies:
        - PolicyName: read-access-keys
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  # Metadata only (never returns secrets); used for Bedrock API keys.
                  - iam:ListServiceSpecificCredentials
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt AuditRole.Arn
