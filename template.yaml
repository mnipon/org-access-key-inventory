AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Org-wide IAM access key and long-term Amazon Bedrock API key inventory. A
  Lambda in the management account enumerates all org accounts, assumes a read
  role in each, lists IAM access keys and Bedrock API key metadata, and writes
  a per-run folder (manifest + CSVs + changelogs) plus a latest/ copy to an
  encrypted, versioned S3 bucket. Optional scheduled execution.

Parameters:
  Prefix:
    Type: String
    Default: credential-inventory
    AllowedPattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$"
    ConstraintDescription: >
      Non-empty; letters, digits, '.', '_', '-' and inner '/' only (no leading
      or trailing slash).
    Description: >
      Root S3 key prefix. Each run writes <Prefix>/runs/YYYY/MM/DD/<run-id>/
      (manifest.json, CSVs, changelogs), refreshes <Prefix>/latest/, and keeps
      change-detection state in <Prefix>/state/. Stacks created before the
      run-centric layout used access-key-reports (see LegacyPrefix).
  LegacyPrefix:
    Type: String
    Default: access-key-reports
    AllowedPattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$"
    ConstraintDescription: >
      Non-empty; letters, digits, '.', '_', '-' and inner '/' only (no leading
      or trailing slash).
    Description: >
      Prefix of the previous S3 layout. Read only when <Prefix>/state/ has no
      state yet, to seed change detection from
      <LegacyPrefix>/state/keys-state.json and
      <LegacyPrefix>/bedrock-api-keys/state/keys-state.json. Nothing under it
      is ever modified, moved, or deleted.
  CandidateRoles:
    Type: CommaDelimitedList
    Default: OrgAccessKeyAuditRole,OrganizationAccountAccessRole,AWSControlTowerExecution
    Description: >
      Role names to try (in order) when assuming into a member account. The
      Lambda uses the first one it can assume. If you add a custom name here,
      also add its ARN to the AssumeMemberRoles policy statement below.
  EnableSchedule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Run the inventory on a recurring schedule.
  ScheduleExpression:
    Type: String
    Default: rate(1 day)
    Description: EventBridge schedule expression (used only if EnableSchedule=true).
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email address to notify when the inventory hits errors that need an
      administrator. If left blank, NO SNS topic, subscription, or alarms are
      created at all (error details still appear in the return payload and
      CloudWatch logs). If set, AWS emails a one-time subscription confirmation
      that you MUST click before any alerts can be delivered.
  MaskHead:
    Type: Number
    Default: 4
    Description: Number of leading characters of the access key id to keep visible.
  MaskTail:
    Type: Number
    Default: 4
    Description: >
      Number of trailing characters to keep visible. Set MaskHead and MaskTail
      both to 0 to disable masking and show the full key id.
  MetricNamespace:
    Type: String
    Default: OrgAccessKeyInventory
    Description: >
      CloudWatch namespace for the inventory's custom metrics (key counts,
      staleness, and run-to-run changes) and the dashboard.
  StaleAgeDays:
    Type: Number
    Default: 90
    Description: >
      Age in days at/above which an access key is counted as "stale" (needs
      rotation) in the KeysStale / KeysStaleActive metrics.
  PublishMetrics:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Publish custom CloudWatch metrics after each run. Set to "false" to skip
      metric publishing (the CSV report and history changelog are still written).
  IncludeBedrockKeys:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Also inventory long-term Amazon Bedrock API keys (IAM service-specific
      credentials) into bedrock-api-keys.csv in each run folder (and latest/).
      Requires iam:ListServiceSpecificCredentials in every member account's
      audit role: redeploy the OrgAccessKeyAuditRole StackSet first. Short-term
      Bedrock API keys cannot be inventoried.
  BedrockExpiryWarnDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: >
      An active Bedrock API key that expires within this many days is counted
      in the BedrockKeysExpiringSoon metric.

Conditions:
  DoSchedule: !Equals [!Ref EnableSchedule, "true"]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  DoMetrics: !Equals [!Ref PublishMetrics, "true"]

Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # latest/ and state/ are overwritten every run, so their old versions pile
      # up; expire those noncurrent versions after 30 days. runs/ is never
      # expired, and current versions never expire. CloudFormation owns the
      # bucket's lifecycle rules: rules added by hand are replaced on update.
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-latest
            Status: Enabled
            Prefix: !Sub "${Prefix}/latest/"
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-noncurrent-state
            Status: Enabled
            Prefix: !Sub "${Prefix}/state/"
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      DisplayName: Access-key inventory alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: access-key-inventory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverAccounts
                Effect: Allow
                Action: organizations:ListAccounts
                Resource: "*"
              - Sid: AssumeMemberRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - arn:aws:iam::*:role/OrgAccessKeyAuditRole
                  - arn:aws:iam::*:role/OrganizationAccountAccessRole
                  - arn:aws:iam::*:role/AWSControlTowerExecution
              - Sid: ReadLocalIamKeys
                Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - iam:ListServiceSpecificCredentials
                Resource: "*"
              - Sid: WriteReport
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ReportBucket.Arn}/*"
              - Sid: ReadRunState
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ReportBucket.Arn}/*"
              - Sid: PublishMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref MetricNamespace
              - !If
                - HasAlertEmail
                - Sid: PublishAlerts
                  Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref AlertTopic
                - !Ref AWS::NoValue

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-inventory"
      RetentionInDays: 90

  InventoryFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-inventory"
      Description: Org-wide IAM access key and Bedrock API key inventory to S3 CSV
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt FunctionRole.Arn
      Code: ./lambda
      Environment:
        Variables:
          BUCKET: !Ref ReportBucket
          PREFIX: !Ref Prefix
          LEGACY_PREFIX: !Ref LegacyPrefix
          CANDIDATE_ROLES: !Join [",", !Ref CandidateRoles]
          ALERT_TOPIC_ARN:
            !If [HasAlertEmail, !Ref AlertTopic, !Ref "AWS::NoValue"]
          MASK_HEAD: !Ref MaskHead
          MASK_TAIL: !Ref MaskTail
          METRIC_NAMESPACE: !Ref MetricNamespace
          STALE_AGE_DAYS: !Ref StaleAgeDays
          PUBLISH_METRICS: !Ref PublishMetrics
          INCLUDE_BEDROCK_KEYS: !Ref IncludeBedrockKeys
          BEDROCK_EXPIRY_WARN_DAYS: !Ref BedrockExpiryWarnDays

  # EventBridge Scheduler (the modern replacement for AWS::Events::Rule schedules).
  # Unlike a legacy rule, Scheduler invokes the target by assuming a role, so no
  # Lambda resource-based permission is needed.
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: DoSchedule
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-inventory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt InventoryFunction.Arn

  InventorySchedule:
    Type: AWS::Scheduler::Schedule
    Condition: DoSchedule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Recurring org-wide IAM access-key inventory.
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt InventoryFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  # Alarm 1: the function itself crashed / timed out (Lambda Errors metric).
  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: Inventory Lambda invocation failed (crash/timeout).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref InventoryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Alarm 2: the function ran but one or more accounts could not be inventoried.
  # Driven by a metric filter on the "ADMIN ACTION REQUIRED" log line.
  AdminActionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasAlertEmail
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"ADMIN ACTION REQUIRED"'
      MetricTransformations:
        - MetricNamespace: !Ref MetricNamespace
          MetricName: AdminActionRequired
          MetricValue: "1"
          DefaultValue: 0

  AdminActionAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertEmail
    Properties:
      AlarmDescription: >
        One or more accounts could not be inventoried, their Bedrock API keys
        could not be listed, or a report/state file could not be written to S3
        (needs admin).
      Namespace: !Ref MetricNamespace
      MetricName: AdminActionRequired
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # A dashboard that visualizes the custom metrics published by the Lambda:
  # the org's key posture over time plus run-to-run changes (history).
  InventoryDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: DoMetrics
    Properties:
      DashboardName: !Sub "${AWS::StackName}-access-keys"
      DashboardBody: !Sub |
        {
          "start": "-P7D",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# Org-wide IAM Access Key Inventory\nPosture and history from the `${AWS::StackName}-inventory` Lambda. Metrics update on each run (namespace `${MetricNamespace}`)."
              }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 24, "height": 3,
              "properties": {
                "title": "Current counts (latest run)",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  [ "${MetricNamespace}", "KeysTotal" ],
                  [ "${MetricNamespace}", "KeysActive" ],
                  [ "${MetricNamespace}", "KeysInactive" ],
                  [ "${MetricNamespace}", "KeysNeverUsed" ],
                  [ "${MetricNamespace}", "KeysLastUsedUnknown" ],
                  [ "${MetricNamespace}", "KeysStale" ],
                  [ "${MetricNamespace}", "AccountsScanned" ],
                  [ "${MetricNamespace}", "AccountsWithErrors" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 5, "width": 12, "height": 6,
              "properties": {
                "title": "Keys by status over time",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "KeysTotal" ],
                  [ "${MetricNamespace}", "KeysActive" ],
                  [ "${MetricNamespace}", "KeysInactive" ],
                  [ "${MetricNamespace}", "KeysNeverUsed" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 5, "width": 12, "height": 6,
              "properties": {
                "title": "Rotation risk: stale & never-used keys",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "KeysStale" ],
                  [ "${MetricNamespace}", "KeysStaleActive" ],
                  [ "${MetricNamespace}", "KeysNeverUsed" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 11, "width": 12, "height": 6,
              "properties": {
                "title": "History: changes since previous run",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "KeysAdded" ],
                  [ "${MetricNamespace}", "KeysRemoved" ],
                  [ "${MetricNamespace}", "KeysActivated" ],
                  [ "${MetricNamespace}", "KeysDeactivated" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 11, "width": 12, "height": 6,
              "properties": {
                "title": "Run health",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${InventoryFunction}", { "label": "Lambda invocation errors" } ],
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${InventoryFunction}", { "label": "Invocations" } ]
                ]
              }
            },
            {
              "type": "text", "x": 0, "y": 17, "width": 24, "height": 2,
              "properties": {
                "markdown": "## Amazon Bedrock API keys (long-term)\nLong-term Bedrock API keys are IAM service-specific credentials (report: `bedrock-api-keys.csv` in each run folder and in `latest/`). Short-term Bedrock API keys are never stored in IAM and cannot be inventoried; detect their use with CloudTrail."
              }
            },
            {
              "type": "metric", "x": 0, "y": 19, "width": 24, "height": 3,
              "properties": {
                "title": "Bedrock API keys: current counts (latest run)",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  [ "${MetricNamespace}", "BedrockKeysTotal" ],
                  [ "${MetricNamespace}", "BedrockKeysActive" ],
                  [ "${MetricNamespace}", "BedrockKeysInactive" ],
                  [ "${MetricNamespace}", "BedrockKeysNoExpiryActive" ],
                  [ "${MetricNamespace}", "BedrockKeysExpiringSoon" ],
                  [ "${MetricNamespace}", "BedrockKeysExpired" ],
                  [ "${MetricNamespace}", "BedrockKeysStaleActive" ],
                  [ "${MetricNamespace}", "BedrockAccountsWithErrors" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 22, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock API keys by status",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "BedrockKeysTotal" ],
                  [ "${MetricNamespace}", "BedrockKeysActive" ],
                  [ "${MetricNamespace}", "BedrockKeysInactive" ],
                  [ "${MetricNamespace}", "BedrockKeysExpired" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 22, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock API key expiry risk",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "BedrockKeysNoExpiry" ],
                  [ "${MetricNamespace}", "BedrockKeysNoExpiryActive" ],
                  [ "${MetricNamespace}", "BedrockKeysExpiringSoon" ],
                  [ "${MetricNamespace}", "BedrockKeysStaleActive" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 28, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock history: changes since previous run",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "BedrockKeysAdded" ],
                  [ "${MetricNamespace}", "BedrockKeysRemoved" ],
                  [ "${MetricNamespace}", "BedrockKeysActivated" ],
                  [ "${MetricNamespace}", "BedrockKeysDeactivated" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 28, "width": 12, "height": 6,
              "properties": {
                "title": "Bedrock coverage",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "${MetricNamespace}", "BedrockAccountsWithErrors", { "label": "Bedrock listing failed (account otherwise inventoried)" } ],
                  [ "${MetricNamespace}", "AccountsWithErrors", { "label": "Account not inventoried at all" } ]
                ]
              }
            }
          ]
        }

Outputs:
  BucketName:
    Value: !Ref ReportBucket
  FunctionName:
    Value: !Ref InventoryFunction
  AlertTopicArn:
    Condition: HasAlertEmail
    Value: !Ref AlertTopic
  LogGroup:
    Value: !Ref LogGroup
  ScheduleName:
    Condition: DoSchedule
    Description: EventBridge Scheduler schedule driving recurring runs.
    Value: !Ref InventorySchedule
  MetricNamespace:
    Value: !Ref MetricNamespace
    Description: CloudWatch namespace holding the inventory's custom metrics.
  RunsPrefix:
    Description: >
      One folder per run (runs/YYYY/MM/DD/<run-id>/) with manifest.json, the
      CSVs, and changelogs.
    Value: !Sub "s3://${ReportBucket}/${Prefix}/runs/"
  LatestPrefix:
    Description: Copy of the most recent run's CSVs and manifest.json.
    Value: !Sub "s3://${ReportBucket}/${Prefix}/latest/"
  StatePrefix:
    Description: Change-detection state (access-keys.json, bedrock-api-keys.json).
    Value: !Sub "s3://${ReportBucket}/${Prefix}/state/"
  DashboardName:
    Condition: DoMetrics
    Value: !Sub "${AWS::StackName}-access-keys"
  DashboardUrl:
    Condition: DoMetrics
    Description: Direct link to the CloudWatch dashboard.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-access-keys"
